<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRITICAL_SYSTEM_OVERRIDE // 0x7FF9A2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030604;
      color: #00ff41;
      font-family: "Consolas", "Courier New", monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      user-select: none;
    }

    /* Efecto scanlines CRT */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 65, 0.04) 0px,
        rgba(0, 255, 65, 0.04) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Parpadeo rojo de alarma en bordes */
    .alarm-border {
      position: fixed;
      inset: 0;
      border: 4px solid #ff1e1e;
      box-shadow: inset 0 0 40px rgba(255, 30, 30, 0.55);
      pointer-events: none;
      animation: pulseRed 1s infinite alternate;
      z-index: 9;
    }

    @keyframes pulseRed {
      from { opacity: 0.35; }
      to { opacity: 0.95; }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #140505;
      border: 1px solid #ff2a2a;
      color: #ff3b3b;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 2;
    }

    .blink {
      animation: blinker 0.7s linear infinite;
    }

    @keyframes blinker {
      50% { opacity: 0; }
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
      flex: 1;
      margin: 14px 0;
      overflow: hidden;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(5, 12, 7, 0.94);
      border: 1px solid #00ff41;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.12);
    }

    .panel-title {
      font-size: 0.78rem;
      color: #030604;
      background: #00ff41;
      padding: 3px 8px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .panel-title.danger {
      background: #ff2a2a;
      color: #fff;
    }

    .stream-box {
      flex: 1;
      overflow: hidden;
      font-size: 0.78rem;
      line-height: 1.45;
      word-break: break-all;
      color: #19e64c;
    }

    .stream-box div {
      margin-bottom: 3px;
    }

    .hex-dump {
      color: #69ff94;
      font-size: 0.72rem;
      opacity: 0.88;
    }

    .err-line {
      color: #ff4747;
      font-weight: bold;
    }

    .warn-line {
      color: #ffd000;
    }

    .bottom-panel {
      background: #080f0a;
      border: 1px solid #ff2a2a;
      padding: 12px 16px;
      z-index: 2;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #ff4d4d;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 18px;
      background: #1a0707;
      border: 1px solid #ff2a2a;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        45deg,
        #ff1e1e,
        #ff1e1e 10px,
        #b30000 10px,
        #b30000 20px
      );
      transition: width 0.3s linear;
    }

    .sys-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.75rem;
      color: #88cc99;
    }
  </style>
</head>
<body>
  <div class="alarm-border"></div>

  <div class="top-bar">
    <span><span class="blink">▲</span> INTRUSION DETECTED // UID:0 (ROOT) ESCALATED</span>
    <span id="session-id">SESSION: 0x00000000</span>
  </div>

  <div class="grid-container">
    <div class="panel">
      <div class="panel-title">
        <span>/DEV/MEM :: KERNEL_EXEC_TRACE</span>
        <span>PID: 4092 [LOCKED]</span>
      </div>
      <div class="stream-box" id="main-stream"></div>
    </div>

    <div class="panel">
      <div class="panel-title danger">
        <span>RAW_SOCKET // EXFILTRATION</span>
        <span>TLS_BYPASS</span>
      </div>
      <div class="stream-box hex-dump" id="hex-stream"></div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="progress-header">
      <span id="action-label">OVERRIDING PARTITION TABLE & DUMPING CREDENTIALS...</span>
      <span id="pct-label">0.0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="sys-info">
      <span id="client-agent">TARGET_ENV: DETECTING...</span>
      <span>CRYPTO_CIPHER: AES-256-GCM // RSA-4096</span>
      <span id="timer-clock">UPTIME_ERR: 00:00:00</span>
    </div>
  </div>

  <script>
    const mainStream = document.getElementById("main-stream");
    const hexStream = document.getElementById("hex-stream");
    const progressFill = document.getElementById("progress-fill");
    const pctLabel = document.getElementById("pct-label");
    const actionLabel = document.getElementById("action-label");
    const sessionIdEl = document.getElementById("session-id");
    const clientAgentEl = document.getElementById("client-agent");
    const timerClockEl = document.getElementById("timer-clock");

    // Mostrar datos técnicos reales del navegador de quien abre la página para darle más realismo
    sessionIdEl.textContent = "SESSION: 0x" + Math.floor(Math.random() * 0xffffffff).toString(16).toUpperCase().padStart(8, "0");
    clientAgentEl.textContent = "NODE: " + navigator.platform.toUpperCase() + " // CORES: " + (navigator.hardwareConcurrency || 4);

    const commands = [
      "[0x004F1A] SYSCALL execve('/bin/sh', ['-c', 'chmod 777 /etc/shadow']) -> OK",
      "[0x008B2C] INJECTING PAYLOAD INTO 0x7FFE89A21000 ... BUFFER OVERFLOW CONFIRMED",
      "[WARN] FIREWALL_DAEMON (iptables) TERMINATED WITH SIGKILL (9)",
      "[0x00C911] MOUNTING /dev/nvme0n1p2 AS READ/WRITE ... SUCCESS",
      "[ERR!] KERNEL PANIC BYPASSED -> RING-0 HOOK INSTALLED",
      "[0x011A04] DUMPING NTLM / SHA-512 HASHES FROM /var/lib/auth.db...",
      "[0x014F88] ESTABLISHING REVERSE TUNNEL -> 185.220.101.44:4444 [ESTABLISHED]",
      "[WARN] SSL_PINNING_VERIFICATION DISABLED FOR ALL OUTBOUND SOCKETS",
      "[0x019D30] READING BROWSER_COOKIES, SESSION_TOKENS, KEYCHAIN_STORE...",
      "[ERR!] SECTOR 0x000000FF OVERWRITTEN WITH ZERO-FILL STREAM",
      "[0x022E19] COMPILING POLYMORPHIC STUB IN MEMORY (4096 BYTES)...",
      "[0x027A41] UPLOADING ENCRYPTED ARCHIVE: dump_core_sys.tar.gz.enc"
    ];

    const actions = [
      "OVERRIDING PARTITION TABLE & DUMPING CREDENTIALS...",
      "EXTRACTING LOCAL STORAGE, TOKENS & SESSION KEYS...",
      "ENCRYPTING SYSTEM VOLUMES [RSA-4096]...",
      "TRANSMITTING PACKETS TO REMOTE HOST 185.220.101.44...",
      "WIPING SYSTEM LOGS (/var/log/syslog, /var/log/auth.log)..."
    ];

    function randomHex(len) {
      let out = "";
      const chars = "0123456789ABCDEF";
      for (let i = 0; i < len; i++) {
        out += chars[Math.floor(Math.random() * 16)];
        if (i % 2 === 1 && i < len - 1) out += " ";
      }
      return out;
    }

    function addMainLine() {
      const div = document.createElement("div");
      const r = Math.random();
      if (r < 0.65) {
        const cmd = commands[Math.floor(Math.random() * commands.length)];
        div.textContent = cmd;
        if (cmd.includes("[ERR!]")) div.className = "err-line";
        else if (cmd.includes("[WARN]")) div.className = "warn-line";
      } else {
        const addr = "0x" + Math.floor(Math.random() * 0xffffffffffff).toString(16).toUpperCase().padStart(12, "0");
        div.textContent = `MOV RAX, [${addr}] ; XOR RDX, 0x${randomHex(4).replace(/ /g, "")} ; JMP 0x${randomHex(4).replace(/ /g, "")}`;
      }
      mainStream.appendChild(div);
      if (mainStream.children.length > 28) {
        mainStream.removeChild(mainStream.firstChild);
      }
    }

    function addHexLine() {
      const div = document.createElement("div");
      const offset = Math.floor(Math.random() * 65535).toString(16).toUpperCase().padStart(4, "0");
      div.textContent = `${offset}: ${randomHex(16)}`;
      hexStream.appendChild(div);
      if (hexStream.children.length > 32) {
        hexStream.removeChild(hexStream.firstChild);
      }
    }

    let pct = 0;
    let actionIdx = 0;

    setInterval(() => {
      addMainLine();
    }, 90);

    setInterval(() => {
      addHexLine();
    }, 65);

    setInterval(() => {
      if (pct < 99.8) {
        pct += Math.random() * 1.4;
        if (pct > 99.8) pct = 99.8;
        progressFill.style.width = pct.toFixed(1) + "%";
        pctLabel.textContent = pct.toFixed(1) + "%";

        const nextAction = Math.floor((pct / 100) * actions.length);
        if (nextAction !== actionIdx && actions[nextAction]) {
          actionIdx = nextAction;
          actionLabel.textContent = actions[actionIdx];
        }
      } else {
        actionLabel.textContent = "CRITICAL: ROOT PERSISTENCE ACTIVE // DO NOT POWER OFF";
      }
    }, 280);

    let seconds = 0;
    setInterval(() => {
      seconds++;
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, "0");
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
      const secs = String(seconds % 60).padStart(2, "0");
      timerClockEl.textContent = `ELAPSED: ${hrs}:${mins}:${secs}`;
    }, 1000);
  </script>
</body>
</html>
